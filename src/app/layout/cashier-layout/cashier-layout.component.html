<div class="cashier-shell" [class.menu-open]="menuOpen()">
  <!-- =====================================================
       TOPBAR
  ====================================================== -->

  <header class="topbar">
    <div class="topbar-left">
      <!-- BURGER MENU -->
      <button
        type="button"
        class="menu-button"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      >
        <i
          class="bx"
          [class.bx-menu]="!menuOpen()"
          [class.bx-x]="menuOpen()"
        ></i>
      </button>

      <div class="topbar-brand">
        <div class="brand-mark">KS</div>

        <div class="brand-copy">
          <strong>KALYE SILOG</strong>
          <span>Cashier POS</span>
        </div>
      </div>
    </div>

    <!-- TOPBAR RIGHT -->

    <div class="topbar-right">
      <!-- STORE STATUS -->
      <div class="store-status">
        <span class="status-dot"></span>
        <span>Store Open</span>
      </div>

      <div class="divider"></div>

      <!-- PROFILE -->
      <div class="cashier-profile">
        <div class="avatar">IS</div>

        <div class="profile-copy">
          <strong>Ivan Santos</strong>
          <span>Cashier</span>
        </div>

        <i class="bx bx-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- =====================================================
       MENU OVERLAY
  ====================================================== -->

  <div
    class="menu-overlay"
    [class.visible]="menuOpen()"
    (click)="closeMenu()"
  ></div>

  <!-- =====================================================
       SLIDE MENU
  ====================================================== -->

  <aside class="sidebar" [class.open]="menuOpen()">
    <!-- MENU HEADER -->

    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">KS</div>

        <div class="brand-copy">
          <strong>KALYE SILOG</strong>
          <span>Cashier POS</span>
        </div>
      </div>

      <button
        type="button"
        class="close-menu"
        (click)="closeMenu()"
        aria-label="Close menu"
      >
        <i class="bx bx-x"></i>
      </button>
    </div>

    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav class="navigation">
      <div class="nav-label">POINT OF SALE</div>

      <!-- NEW ORDER -->

      <a
        routerLink="/cashier/pos"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="closeMenu()"
      >
        <i class="bx bx-cart-alt"></i>

        <span>New Order</span>
      </a>

      <!-- ORDERS -->

      <a
        routerLink="/cashier/active-orders"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMenu()"
      >
        <i class="bx bx-receipt"></i>

        <span>Orders</span>

        <span class="nav-count">4</span>
      </a>

      <!-- SHIFT -->

      <a
        routerLink="/cashier/shift"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMenu()"
      >
        <i class="bx bx-wallet"></i>

        <span>My Shift</span>
      </a>

      <div class="nav-divider"></div>

      <div class="nav-label">SYSTEM</div>

      <!-- PRINTERS -->

      <a
        routerLink="/cashier/printers"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMenu()"
      >
        <i class="bx bx-printer"></i>

        <span>Printers</span>
      </a>
    </nav>

    <!-- =================================================
         SIDEBAR BOTTOM
    ================================================== -->

    <div class="sidebar-bottom">
      <!-- SHIFT STATUS -->

      <div class="cashier-status">
        <span class="status-dot"></span>

        <div class="status-copy">
          <strong>Shift Active</strong>
          <small>Started 6:02 AM</small>
        </div>
      </div>

      <!-- LOGOUT -->

      <a routerLink="/" class="logout" (click)="closeMenu()">
        <i class="bx bx-log-out"></i>

        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">
    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
